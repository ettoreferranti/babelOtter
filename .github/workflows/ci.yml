name: CI

# `push` deliberately carries a branch filter. Without one, every push to a
# branch with an open pull request runs this whole pipeline twice.
# Mutation testing lives in mutation.yml, which runs only when the kit changes.
# `pull_request` already covers every branch on its way to main.
on:
  pull_request:
  push:
    branches:
      - main

# BABELOTTER_INTEGRATION is deliberately unset: integration tests are local-only.
jobs:
  test:
    name: Build and test
    runs-on: macos-15
    # The default is 360 minutes. Nothing here has ever taken more than a
    # minute; a job that hangs should fail, not idle for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: ls /Applications | grep Xcode || echo "no /Applications/Xcode*.app found"

      # The package declares swift-tools-version: 6.0. Select a newer Xcode only
      # if the image actually ships one at this path; otherwise fall back to
      # whatever xcode-select already points at rather than failing the job.
      # No third-party setup action — this is the built-in switch only.
      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          else
            echo "Xcode_16.4.app not present on this image; using the default Xcode."
          fi

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

